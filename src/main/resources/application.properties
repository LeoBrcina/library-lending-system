# Application
spring.application.name=library-lending-system

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/library_lending}
spring.datasource.username=${DB_USERNAME:library_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
